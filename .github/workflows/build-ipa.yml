name: Build Multica iOS IPA (unsigned)

on:
  workflow_dispatch: # 手动触发
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ipa.yml'

concurrency:
  group: ipa-build
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-26 # Xcode 26.x：RN 0.86 要求 >=16.1；ExpoModulesJSI xcframework 要求 Swift tools 6.2
    timeout-minutes: 120
    permissions:
      contents: write # 失败时把诊断日志 commit 回仓库，便于外部读取
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prep diagnostics dir
        run: mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics"

      - name: Pin Xcode and verify iOS SDK
        run: |
          set +e
          echo "== Xcode apps =="
          ls /Applications | grep -i xcode
          # 遍历所有 Xcode，选第一个带 iphoneos SDK 的（镜像漂移时可能有的是坏的）
          for XCODE_APP in $(ls -d /Applications/Xcode*.app 2>/dev/null); do
            sudo xcode-select -s "$XCODE_APP" || true
            if xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
              echo "SELECTED=$XCODE_APP (has iphoneos SDK)"
              break
            else
              echo "skip $XCODE_APP (no iphoneos SDK)"
              XCODE_APP=""
            fi
          done
          if [ -z "$XCODE_APP" ]; then
            echo "== no Xcode with iphoneos SDK; try downloadPlatform =="
            sudo xcode-select -s /Applications/Xcode*.app || true
            sudo xcodebuild -downloadPlatform iOS || echo "download failed"
            xcode-select -p
          fi
          xcodebuild -version
          echo "== iphoneos SDK =="
          xcrun --sdk iphoneos --show-sdk-path || echo "SDK_MISSING"
          xcrun --sdk iphoneos --show-sdk-version || echo "SDK_VERSION_MISSING"
          xcrun simctl list runtimes 2>/dev/null | head -5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (workspace root)
        run: pnpm install

      - name: Lower Expo minimal iOS deployment target check
        # 目标设备 iOS 16.2 低于 SDK 57 官方基线 16.4。
        # 只改 expo-build-properties 里的"最低版本常量"（16.4 -> 16.0），
        # 不改任何校验逻辑/其它字段，范围可控。
        run: |
          set +e
          F=$(find "$GITHUB_WORKSPACE/node_modules/.pnpm" -path "*expo-build-properties*/build/pluginConfig.js" | head -1)
          if [ -z "$F" ]; then
            F=$(find "$GITHUB_WORKSPACE" -path "*expo-build-properties*/build/pluginConfig.js" -not -path "*/ci-diagnostics/*" | head -1)
          fi
          echo "plugin file: $F"
          echo "$F" > "$GITHUB_WORKSPACE/ci-diagnostics/patched-file.txt"
          if [ -z "$F" ]; then
            echo "::error title=patch-target-not-found::expo-build-properties pluginConfig.js not found"
            exit 1
          fi
          perl -pi -e "s/deploymentTarget: '16\.4',/deploymentTarget: '16.0',/" "$F"
          grep -n "deploymentTarget: '" "$F" | head -3
          if ! grep -q "deploymentTarget: '16.0'," "$F"; then
            echo "::error title=patch-failed::constant 16.4 not replaced"
            exit 1
          fi
          echo "patched OK"

      - name: Patch all podspecs 16.4 -> 16.2 (Expo autolinking platform check)
        # pod install 会逐个检查模块 podspec 的平台要求（16.4），
        # 不统一放行则模块被 "not linked"。这里把 node_modules 里所有
        # podspec 的 "16.4" 平台声明改成 16.2（仅编译目标声明）。
        run: |
          set +e
          count_before=$(grep -rl "16.4" "$GITHUB_WORKSPACE/apps/mobile/node_modules" 2>/dev/null | wc -l)
          find "$GITHUB_WORKSPACE/apps/mobile/node_modules" -name "*.podspec*" -print0 2>/dev/null | xargs -0 perl -pi -e 's/16\.4/16.2/g' 2>/dev/null
          find "$GITHUB_WORKSPACE/node_modules/.pnpm" -name "*.podspec*" -print0 2>/dev/null | xargs -0 perl -pi -e 's/16\.4/16.2/g' 2>/dev/null
          count_after=$(grep -rl "16.2" "$GITHUB_WORKSPACE/apps/mobile/node_modules" 2>/dev/null | wc -l)
          echo "podspec patch: before=$count_before after16.2=$count_after"
          echo "::notice title=podspec-patch::before=$count_before after16.2=$count_after"
          left=$(grep -rl "16.4" "$GITHUB_WORKSPACE/apps/mobile/node_modules" 2>/dev/null | head -5)
          if [ -n "$left" ]; then
            echo "::warning title=podspec-16.4-left::$left"
          fi

      - name: Prebuild iOS project (generate native project only)
        env:
          APP_ENV: production
          EXPO_BUNDLE_IDENTIFIER_PROD: com.yourname.multica
          EXPO_NO_DOCTOR: 1
          EXPO_NO_TELEMETRY: 1
          CI: true
        run: |
          set +e
          cd apps/mobile
          if [ ! -f .env.production.local ]; then
            cp .env.production.example .env.production.local 2>/dev/null || true
          fi
          LOG="$GITHUB_WORKSPACE/ci-diagnostics/prebuild.txt"
          pnpm exec expo prebuild -p ios --no-install > "$LOG" 2>&1
          code=$?
          cat "$LOG"
          echo "== Podfile =="
          head -20 ios/Podfile 2>/dev/null
          echo "prebuild exit=$code"
          if [ "$code" -ne 0 ]; then
            ERR=$(grep -nEi 'error|invalid|must be|requires|minimum|supported' "$LOG" | tail -20 | tr '\n' '|' | sed 's/::/ -- /g; s/%/%25/g' | cut -c1-1400)
            echo "::error title=prebuild-failed::$ERR"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f ci-diagnostics || true
            git commit -m "ci: prebuild diagnostics (run ${GITHUB_RUN_ID})" || true
            git push > /tmp/push.log 2>&1
            echo "::error title=diag-push-result::exit=$? :: $(tail -3 /tmp/push.log | tr '\n' '|' | sed 's/::/ -- /g' | cut -c1-400)"
            exit "$code"
          fi
          exit 0

      - name: Install CocoaPods dependencies (with diagnostics)
        id: pods
        env:
          LOG_NAME: pod-install.txt
        run: |
          set +e   # 关闭 bash -e，否则失败会直接中止，诊断代码永远执行不到
          cd apps/mobile/ios
          LOG="$GITHUB_WORKSPACE/ci-diagnostics/pod-install.txt"
          {
            echo "== versions =="
            node -v
            ruby -v
            pod --version
            xcodebuild -version
            echo "== ios dir =="
            ls -la
            echo "== pod install =="
            pod install
            echo "pod install exit=$?"
            ls Pods 2>/dev/null | head -5
          } > "$LOG" 2>&1
          cat "$LOG"
          if [ -d Pods ]; then
            echo "pods OK"
            exit 0
          fi
          ERR=$(grep -nEi 'error|fatal|failed|exception|not found|no such|cannot|unable to|exit=' "$LOG" | grep -v 'Enabling modular headers' | tail -25 | tr '\n' '|' | sed 's/::/ -- /g; s/%/%25/g' | cut -c1-1400)
          echo "::error title=pod-error-lines::$ERR"
          LAST=$(tail -12 "$LOG" | tr '\n' '|' | sed 's/::/ -- /g; s/%/%25/g' | cut -c1-900)
          echo "::error title=pod-last-lines::$LAST"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-diagnostics || true
          git commit -m "ci: pod install diagnostics (run ${GITHUB_RUN_ID})" || true
          git push > /tmp/push.log 2>&1
          echo "::error title=diag-push-result::exit=$? :: $(tail -3 /tmp/push.log | tr '\n' '|' | sed 's/::/ -- /g' | cut -c1-400)"
          exit 1

      - name: Upload pods diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-pod
          path: ci-diagnostics/
          if-no-files-found: ignore

      - name: Build unsigned .app (Release)
        env:
          LOG_NAME: xcodebuild.txt
        run: |
          set +e
          cd apps/mobile/ios
          LOG="$GITHUB_WORKSPACE/ci-diagnostics/xcodebuild.txt"
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error title=workspace-not-found::ios dir listing: $(ls | tr '\n' '|' | cut -c1-600)"
            exit 1
          fi
          RAW=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null)
          SCHEMES=$(echo "$RAW" | awk '/Schemes:/{f=1;next} f && NF {gsub(/^[ \t]+/,""); if ($0 != "") print $0}' | tr '\n' ',')
          SCHEME=$(echo "$SCHEMES" | tr ',' '\n' | grep -i 'multica' | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "WORKSPACE=$WORKSPACE SCHEME=$SCHEME"
          echo "::notice title=detected::workspace=$WORKSPACE schemes=$SCHEMES scheme=$SCHEME"
          # SDK 预检：确保 iphoneos SDK 存在
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          echo "SDK_PATH=$SDK_PATH"
          if [ -z "$SDK_PATH" ]; then
            echo "::error title=iphoneos-sdk-missing::xcrun cannot find iphoneos SDK. Xcode=$(xcodebuild -version 2>&1 | tr '\n' '|')"
            exit 1
          fi
          {
            # 注意：不用 -destination 'generic/platform=iOS'——镜像漂移时 iOS platform
            # 组件可能缺失，destination 匹配会直接报 "iOS 26.0 is not installed"。
            # -sdk iphoneos 是经典 CI 打包写法，只依赖 SDK 目录。
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ../build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
            echo "xcodebuild exit=$?"
          } > "$LOG" 2>&1
          tail -40 "$LOG"
          if ! grep -q "xcodebuild exit=0" "$LOG"; then
            ERR=$(grep -nEi 'error:|fatal|failed|not found|no such|cannot|unable to|exit=|BUILD' "$LOG" | tail -25 | tr '\n' '|' | sed 's/::/ -- /g; s/%/%25/g' | cut -c1-1400)
            echo "::error title=xcode-error-lines::$ERR"
            LAST=$(tail -12 "$LOG" | tr '\n' '|' | sed 's/::/ -- /g; s/%/%25/g' | cut -c1-900)
            echo "::error title=xcode-last-lines::$LAST"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f ci-diagnostics || true
            git commit -m "ci: xcodebuild diagnostics (run ${GITHUB_RUN_ID})" || true
            git push > /tmp/push.log 2>&1
            echo "::error title=diag-push-result::exit=$? :: $(tail -3 /tmp/push.log | tr '\n' '|' | sed 's/::/ -- /g' | cut -c1-400)"
            exit 1
          fi
          # 记录是否有"仅更高版本可用"的 API 被使用（运行期崩溃风险信号）
          grep -iE "is only available in iOS|only available on iOS" "$LOG" | sort -u | head -20 > "$GITHUB_WORKSPACE/ci-diagnostics/availability-warnings.txt" || true
          echo "::notice title=availability-warnings-count::$(wc -l < "$GITHUB_WORKSPACE/ci-diagnostics/availability-warnings.txt")"
          exit 0

      - name: Upload xcodebuild diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-xcodebuild
          path: ci-diagnostics/
          if-no-files-found: ignore

      - name: Package unsigned .ipa
        run: |
          set +e
          cd apps/mobile
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p build/Payload
          rm -rf build/Payload/*.app
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr Multica-unsigned.ipa Payload
          ls -lh Multica-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist" || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multica-unsigned-ipa
          path: apps/mobile/build/Multica-unsigned.ipa
          if-no-files-found: error
