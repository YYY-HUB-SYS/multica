name: Build Multica iOS IPA (unsigned)

on:
  workflow_dispatch: # 手动触发
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ipa.yml'

concurrency:
  group: ipa-build
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15 # Xcode 16.4 —— RN 0.86 要求 >= 16.1，macos-14 只有 15.4
    timeout-minutes: 120
    permissions:
      contents: write # 失败时把诊断日志 commit 回仓库，便于外部读取
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (workspace root)
        run: pnpm install

      - name: Prebuild iOS project (generate native project only)
        env:
          APP_ENV: production
          EXPO_BUNDLE_IDENTIFIER_PROD: com.yourname.multica
          EXPO_NO_DOCTOR: 1
          EXPO_NO_TELEMETRY: 1
          CI: true
        run: |
          set +e
          cd apps/mobile
          if [ ! -f .env.production.local ]; then
            cp .env.production.example .env.production.local 2>/dev/null || true
          fi
          pnpm exec expo prebuild -p ios --no-install
          code=$?
          ls -la ios
          echo "prebuild exit=$code"
          [ "$code" -ne 0 ] && exit "$code"
          exit 0

      - name: Install native build tools
        run: |
          set +e
          brew install cmake ninja || brew upgrade cmake ninja || true
          cmake --version || true
          ninja --version || true

      - name: Prep diagnostics dir
        run: mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics"

      - name: Install CocoaPods dependencies (with diagnostics)
        id: pods
        env:
          LOG_NAME: pod-install.txt
        run: |
          set +e   # 关闭 bash -e，否则失败会直接中止，诊断代码永远执行不到
          cd apps/mobile/ios
          LOG="$GITHUB_WORKSPACE/ci-diagnostics/pod-install.txt"
          {
            echo "== versions =="
            node -v
            ruby -v
            pod --version
            xcodebuild -version
            echo "== ios dir =="
            ls -la
            echo "== Podfile =="
            head -40 Podfile 2>/dev/null
            echo "== pod install attempt 1 =="
            pod install
            echo "attempt1 exit=$?"
            echo "== Pods dir after attempt 1 =="
            ls Pods 2>/dev/null | head -10
          } > "$LOG" 2>&1
          if [ ! -d Pods ]; then
            {
              echo "== pod install attempt 2 (--repo-update) =="
              pod install --repo-update
              echo "attempt2 exit=$?"
            } >> "$LOG" 2>&1
          fi
          cat "$LOG"
          if [ -d Pods ]; then
            echo "pods OK"
            exit 0
          fi
          ERR=$(grep -nEi 'error|fatal|failed|exception|not found|no such|cannot|unable to|exit=' "$LOG" | grep -v 'Enabling modular headers' | tail -25 | tr '\n' '|' | sed 's/::/ -- /g; s/%/%25/g' | cut -c1-1400)
          echo "::error title=pod-error-lines::$ERR"
          LAST=$(tail -12 "$LOG" | tr '\n' '|' | sed 's/::/ -- /g; s/%/%25/g' | cut -c1-900)
          echo "::error title=pod-last-lines::$LAST"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics
          git commit -m "ci: pod install diagnostics (run ${GITHUB_RUN_ID})"
          git push > /tmp/push.log 2>&1
          PUSHRC=$?
          echo "::error title=diag-push-result::exit=$PUSHRC :: $(tail -5 /tmp/push.log | tr '\n' '|' | sed 's/::/ -- /g' | cut -c1-500)"
          exit 1

      - name: Upload pods diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-pod
          path: ci-diagnostics/
          if-no-files-found: ignore

      - name: Build unsigned .app (Release)
        env:
          LOG_NAME: xcodebuild.txt
        run: |
          set +e
          cd apps/mobile/ios
          LOG="$GITHUB_WORKSPACE/ci-diagnostics/xcodebuild.txt"
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error title=workspace-not-found::ios dir listing: $(ls | tr '\n' '|' | cut -c1-600)"
            exit 1
          fi
          RAW=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null)
          SCHEMES=$(echo "$RAW" | awk '/Schemes:/{f=1;next} f && NF {gsub(/^[ \t]+/,""); if ($0 != "") print $0}' | tr '\n' ',')
          SCHEME=$(echo "$SCHEMES" | tr ',' '\n' | grep -i 'multica' | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | tr ',' '\n' | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "WORKSPACE=$WORKSPACE SCHEMES=$SCHEMES SCHEME=$SCHEME"
          echo "::notice title=detected::workspace=$WORKSPACE schemes=$SCHEMES scheme=$SCHEME"
          echo "$RAW" > "$GITHUB_WORKSPACE/ci-diagnostics/xcode-list.txt"
          {
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -derivedDataPath ../build/DerivedData \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
            echo "xcodebuild exit=$?"
          } > "$LOG" 2>&1
          tail -60 "$LOG"
          if ! grep -q "xcodebuild exit=0" "$LOG"; then
            ERR=$(grep -nEi 'error:|fatal|failed|exception|not found|no such|cannot|unable to|exit=|BUILD' "$LOG" | tail -25 | tr '\n' '|' | sed 's/::/ -- /g; s/%/%25/g' | cut -c1-1400)
            echo "::error title=xcode-error-lines::$ERR"
            LAST=$(tail -12 "$LOG" | tr '\n' '|' | sed 's/::/ -- /g; s/%/%25/g' | cut -c1-900)
            echo "::error title=xcode-last-lines::$LAST"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-diagnostics
            git commit -m "ci: xcodebuild diagnostics (run ${GITHUB_RUN_ID})"
            git push > /tmp/push.log 2>&1
            PUSHRC=$?
            echo "::error title=diag-push-result::exit=$PUSHRC :: $(tail -5 /tmp/push.log | tr '\n' '|' | sed 's/::/ -- /g' | cut -c1-500)"
            exit 1
          fi
          exit 0

      - name: Upload xcodebuild diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-xcodebuild
          path: ci-diagnostics/
          if-no-files-found: ignore

      - name: Package unsigned .ipa
        run: |
          set +e
          cd apps/mobile
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p build/Payload
          rm -rf build/Payload/*.app
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr Multica-unsigned.ipa Payload
          ls -lh Multica-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multica-unsigned-ipa
          path: apps/mobile/build/Multica-unsigned.ipa
          if-no-files-found: error