name: Build Multica iOS IPA (unsigned)

on:
  workflow_dispatch: # 手动触发
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ipa.yml'

concurrency:
  group: ipa-build
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (workspace root)
        run: pnpm install

      - name: Prebuild iOS project (generate native project only)
        env:
          APP_ENV: production
          EXPO_BUNDLE_IDENTIFIER_PROD: com.yourname.multica
          EXPO_NO_DOCTOR: 1
          EXPO_NO_TELEMETRY: 1
          CI: true
        run: |
          cd apps/mobile
          # 生产环境变量（云后端 multica.ai）；本地覆盖文件不存在则用默认
          if [ ! -f .env.production.local ]; then
            cp .env.production.example .env.production.local 2>/dev/null || true
          fi
          # 只生成 ios 工程，pod install 由下一步显式执行（便于抓日志）
          pnpm exec expo prebuild -p ios --no-install
          ls -la ios

      - name: Upload CI diagnostics
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics"
          echo "collected at $(date -u +%FT%TZ), run ${GITHUB_RUN_ID}" > "$GITHUB_WORKSPACE/ci-diagnostics/meta.txt"

      - name: Install CocoaPods dependencies (with diagnostics)
        id: pods
        run: |
          set -o pipefail
          cd apps/mobile/ios
          {
            echo "== versions =="
            node -v
            ruby -v
            pod --version || true
            xcodebuild -version
            echo "== ios dir =="
            ls -la
            echo "== pod install =="
            pod install --repo-update
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/pod-install.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=pod install failed::$(tail -c 1500 "$GITHUB_WORKSPACE/ci-diagnostics/pod-install.log" | tr '\n' ' ')"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-diagnostics || true
            git commit -m "ci: pod install diagnostics (run ${GITHUB_RUN_ID})" || true
            git push || true
            exit "$status"
          fi

      - name: Build unsigned .app (Release)
        run: |
          set -o pipefail
          cd apps/mobile/ios
          {
            echo "== schemes =="
            xcodebuild -list -workspace multica.xcworkspace || true
            echo "== build =="
            xcodebuild \
              -workspace multica.xcworkspace \
              -scheme multica \
              -configuration Release \
              -derivedDataPath ../build/DerivedData \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/xcodebuild.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=xcodebuild failed::$(tail -c 1500 "$GITHUB_WORKSPACE/ci-diagnostics/xcodebuild.log" | tr '\n' ' ')"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-diagnostics || true
            git commit -m "ci: xcodebuild diagnostics (run ${GITHUB_RUN_ID})" || true
            git push || true
            exit "$status"
          fi

      - name: Package unsigned .ipa
        run: |
          cd apps/mobile
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p build/Payload
          rm -rf build/Payload/*.app
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr Multica-unsigned.ipa Payload
          ls -lh Multica-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multica-unsigned-ipa
          path: apps/mobile/build/Multica-unsigned.ipa
          if-no-files-found: error