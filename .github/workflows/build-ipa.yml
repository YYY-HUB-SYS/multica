name: Build Multica iOS IPA (unsigned)

on:
  workflow_dispatch: # 手动触发
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ipa.yml'

concurrency:
  group: ipa-build
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (workspace root)
        run: pnpm install

      - name: Prebuild iOS project (with pod install)
        env:
          APP_ENV: production
          EXPO_BUNDLE_IDENTIFIER_PROD: com.yourname.multica
        run: |
          cd apps/mobile
          # 生产环境变量（云后端 multica.ai）；本地覆盖文件不存在则用默认
          if [ ! -f .env.production.local ]; then
            cp .env.production.example .env.production.local 2>/dev/null || true
          fi
          # 关键修复：不加 --no-install，让 prebuild 自动完成 node_modules 关联 + pod install
          pnpm exec expo prebuild -p ios

      - name: Ensure CocoaPods dependencies
        run: |
          cd apps/mobile/ios
          if [ ! -d Pods ]; then
            echo "Pods missing, running pod install manually..."
            pod install --repo-update
          else
            echo "Pods directory present."
          fi
          ls -la

      - name: Build unsigned .app (Release)
        run: |
          cd apps/mobile/ios
          # 诊断：列出可用 scheme，便于失败时定位
          xcodebuild -list -workspace multica.xcworkspace || true
          # 用 xcodebuild 构建 Release，关闭签名 -> 产出未签名 .app
          xcodebuild \
            -workspace multica.xcworkspace \
            -scheme multica \
            -configuration Release \
            -derivedDataPath ../build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          cd apps/mobile
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr Multica-unsigned.ipa Payload
          ls -lh Multica-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multica-unsigned-ipa
          path: apps/mobile/build/Multica-unsigned.ipa
          if-no-files-found: error
