name: Build Multica iOS IPA (unsigned)

on:
  workflow_dispatch: # 手动触发
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ipa.yml'

concurrency:
  group: ipa-build
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write # 失败时把诊断日志 commit 回仓库，便于外部读取
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (workspace root)
        run: pnpm install

      - name: Prebuild iOS project (generate native project only)
        env:
          APP_ENV: production
          EXPO_BUNDLE_IDENTIFIER_PROD: com.yourname.multica
          EXPO_NO_DOCTOR: 1
          EXPO_NO_TELEMETRY: 1
          CI: true
        run: |
          cd apps/mobile
          if [ ! -f .env.production.local ]; then
            cp .env.production.example .env.production.local 2>/dev/null || true
          fi
          pnpm exec expo prebuild -p ios --no-install
          echo "== generated ios dir =="
          ls -la ios

      - name: Prep diagnostics dir
        if: always()
        run: mkdir -p "$GITHUB_WORKSPACE/ci-diagnostics"

      - name: Install CocoaPods dependencies (with diagnostics)
        id: pods
        run: |
          set -o pipefail
          cd apps/mobile/ios
          {
            echo "== versions =="
            node -v
            ruby -v
            pod --version || true
            xcodebuild -version
            echo "== ios dir =="
            ls -la
            echo "== pod install (attempt 1: plain) =="
            pod install || {
              echo "---- attempt 1 failed, retry with --repo-update ----"
              pod install --repo-update
            }
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/pod-install.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "### pod install failed (exit $status)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -120 "$GITHUB_WORKSPACE/ci-diagnostics/pod-install.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=pod install failed, see job summary::$(tail -c 800 "$GITHUB_WORKSPACE/ci-diagnostics/pod-install.log" | tr '\n' ' ')"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-diagnostics || true
            git commit -m "ci: pod install diagnostics (run ${GITHUB_RUN_ID})" || true
            git push || echo "diag push failed (check permissions)" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          echo "== post pod install ==" >> "$GITHUB_STEP_SUMMARY"
          ls -1 *.xcworkspace >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build unsigned .app (Release)
        run: |
          set -o pipefail
          cd apps/mobile/ios
          # workspace 名称由 app.config.ts 的 name 决定（Multica），不写死大小写
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error title=workspace not found::run pod install first; ios dir: $(ls)"
            exit 1
          fi
          # scheme 取 app.config.ts 的 scheme，不存在则回退第一个
          SCHEMES=$(xcodebuild -list -workspace "$WORKSPACE" -json 2>/dev/null | tr -d '\n' | sed -n 's/.*"schemes": *\[\([^]]*\)\].*/\1/p' | tr -d '" ')
          SCHEME=$(echo "$SCHEMES" | tr ',' '\n' | grep -i '^multica$' | head -1)
          [ -z "$SCHEME" ] && SCHEME=$(echo "$SCHEMES" | tr ',' '\n' | head -1)
          echo "WORKSPACE=$WORKSPACE SCHEME=$SCHEME"
          echo "workspace=$WORKSPACE scheme=$SCHEME" >> "$GITHUB_STEP_SUMMARY"
          {
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -derivedDataPath ../build/DerivedData \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-diagnostics/xcodebuild.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "### xcodebuild failed (exit $status)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -120 "$GITHUB_WORKSPACE/ci-diagnostics/xcodebuild.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=xcodebuild failed, see job summary::$(tail -c 800 "$GITHUB_WORKSPACE/ci-diagnostics/xcodebuild.log" | tr '\n' ' ')"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-diagnostics || true
            git commit -m "ci: xcodebuild diagnostics (run ${GITHUB_RUN_ID})" || true
            git push || echo "diag push failed (check permissions)" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Package unsigned .ipa
        run: |
          cd apps/mobile
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p build/Payload
          rm -rf build/Payload/*.app
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr Multica-unsigned.ipa Payload
          ls -lh Multica-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Multica-unsigned-ipa
          path: apps/mobile/build/Multica-unsigned.ipa
          if-no-files-found: error